name: Screenr plot state repair (temporary)
on:
  push:
    branches: [fix/plot-state-20261012]
    paths: [.github/workflows/plot-state-repair-temp.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plot-state-20261012
      - run: |
          python scripts/repair-plot-state.py
          python scripts/repair-sensitivity-adapter.py
          git -c core.whitespace=cr-at-eol diff --check
      - uses: actions/checkout@v4
        with:
          repository: mahmood726-cyber/allmeta
          ref: 42938c1bfec0af24fbdec359476f0332515e0577
          path: .plot-test-harness
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: .plot-test-harness/tests/playwright
      - name: Require real examples and input-preserving plots
        run: |
          cp tests/plot-regressions/plots.mjs .plot-test-harness/tests/playwright/screenr-plots.mjs
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/plot-server.log 2>&1 &
          cd .plot-test-harness/tests/playwright
          node screenr-plots.mjs
      - name: Commit only verified application repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenr.html
          git commit -m 'fix: connect Screenr plots and sensitivity results to canonical records'
          git push origin HEAD:fix/plot-state-20261012
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenr-plot-regressions
          path: .plot-test-harness/tests/playwright/artifacts/screenr-plots/
          retention-days: 7
